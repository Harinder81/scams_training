/* ================= state ================= */
const STORE = "spot-the-scam-v1";
let state = { idx:0, quiz:{}, spot:{}, scale:1 };
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && typeof s === "object") state = Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
let savedIdx = state.idx;
state.idx = 0;

const QUIZ = {};
SLIDES.forEach(s => (s.quizzes || []).forEach(q => { QUIZ[q.id] = q; }));
const LEARN = SLIDES.filter(s => s.section === "learn");
const PRACTICE = SLIDES.filter(s => s.section === "practice");
const TRAVEL = SLIDES.filter(s => s.section === "travel");
const sectionPos = s => s.section === "learn" ? `Lesson ${LEARN.indexOf(s) + 1} of ${LEARN.length}`
  : s.section === "practice" ? `Practice ${PRACTICE.indexOf(s) + 1} of ${PRACTICE.length}`
  : s.section === "travel" ? `Travel ${TRAVEL.indexOf(s) + 1} of ${TRAVEL.length}`
  : s.section === "checkpoint" ? "Halfway results" : "";
const idxOf = id => SLIDES.findIndex(s => s.id === id);
const spotState = id => (state.spot[id] ||= { found:[], misses:0, revealed:false });
const lastFb = {};
let ctxs = {};

/* ================= message rendering ================= */
const TOKEN = /\[\[(\w+)([:>])([^\]|]+)(?:\|([^\]]+))?\]\]|\{\{([^|}]+)\|([^}]+)\}\}/g;

function numbering(slide) {
  const keys = Object.keys(slide.flags || {});
  const map = {};
  if (slide.kind === "anatomy") { keys.forEach((k, i) => map[k] = i + 1); return map; }
  const st = spotState(slide.id);
  st.found.forEach((k, i) => map[k] = i + 1);
  if (st.revealed) keys.filter(k => !st.found.includes(k)).forEach((k, i) => map[k] = st.found.length + i + 1);
  return map;
}

// ctx: null (static), or {mode:"learn"|"play", slide, segs:[], nums}
function segs(str, ctx) {
  let out = "", last = 0;
  const neutral = text => {
    if (!text) return "";
    // allow simple inline HTML authored in data (<br>, <b>, <span class="lnk">)
    if (ctx && ctx.mode === "play" && text.replace(/<[^>]+>/g, "").trim()) {
      const k = ctx.segs.push({ flag:null, ok:null }) - 1;
      return `<span class="seg" data-k="${k}" tabindex="0" role="button">${text}</span>`;
    }
    return text;
  };
  str.replace(TOKEN, (m, fk, kind, ftxt, url, otxt, owhy, off) => {
    out += neutral(str.slice(last, off));
    last = off + m.length;
    if (otxt !== undefined) { // explained neutral segment
      if (ctx && ctx.mode === "play") {
        const k = ctx.segs.push({ flag:null, ok:owhy }) - 1;
        out += `<span class="seg" data-k="${k}" tabindex="0" role="button">${otxt}</span>`;
      } else out += otxt;
      return m;
    }
    const isLink = kind === ">";
    const urlAttr = isLink ? ` data-url="${esc(url || ftxt)}"` : "";
    const lcls = isLink ? " lnk" : "";
    if (!ctx) { out += isLink ? `<span class="lnk">${ftxt}</span>` : ftxt; return m; }
    const f = ctx.slide.flags[fk];
    if (!f) { out += ftxt; return m; }
    const n = ctx.nums[fk];
    if (ctx.mode === "learn") {
      out += `<span class="seg shown${lcls}" data-flag="${fk}" data-n="${n}" tabindex="0" data-tip-title="${esc(n + ". " + f.title)}" data-tip="${esc(f.why)}"${urlAttr}>${ftxt}</span>`;
    } else {
      const st = spotState(ctx.slide.id);
      const k = ctx.segs.push({ flag:fk, ok:null }) - 1;
      const found = st.found.includes(fk);
      const cls = found ? " found" : (st.revealed ? " missed" : "");
      const tipAttrs = (found || st.revealed) ? ` data-tip-title="${esc(n + ". " + f.title)}" data-tip="${esc(f.why)}"` : "";
      out += `<span class="seg${cls}${lcls}" data-k="${k}" data-flag="${fk}"${n ? ` data-n="${n}"` : ""} tabindex="0" role="button"${tipAttrs}${urlAttr}>${ftxt}</span>`;
    }
    return m;
  });
  out += neutral(str.slice(last));
  return out;
}

function renderMsg(msg, ctx) {
  const P = s => segs(s, ctx);
  const play = ctx && ctx.mode === "play" ? " play" : "";
  if (msg.kind === "email") {
    const body = msg.body.map(p => typeof p === "string" ? `<p>${P(p)}</p>` : `<p><span class="fakebtn">${P(p.button)}</span></p>`).join("");
    return `<div class="mock email${play}">
      <div class="mock-label"><span>${icon("mail")} Email</span><span>Today, 7:42 AM</span></div>
      <div class="eh"><span class="lab">From</span><span>${P(msg.from)}</span>
        <span class="lab">To</span><span>you@example.com</span>
        <span class="lab">Subject</span><span class="subj">${P(msg.subject)}</span></div>
      <div class="email-body">${body}
        ${msg.attach ? `<p><span class="attach">${icon("clip")}${P(msg.attach)}</span></p>` : ""}
        ${msg.foot ? `<p class="email-foot">${P(msg.foot)}</p>` : ""}</div>
      ${ctx ? `<div class="statusbar">Point at a link to see where it really goes</div>` : ""}
    </div>`;
  }
  if (msg.kind === "sms" || msg.kind === "chat") {
    const bubbles = msg.bubbles.map(b => typeof b === "string" ? `<div class="bub in">${P(b)}</div>` : `<div class="bub ${b.out ? "out" : "in"}">${P(b.t)}</div>`).join("");
    return `<div class="mock phone ${msg.kind}${play}">
      <div class="phone-top"><span class="avatar">${icon(msg.kind === "chat" ? "person" : "sms")}</span>
        <div class="phone-sender">${P(msg.sender)}</div><small>${msg.kind === "chat" ? "Chat app" : "Text message"}</small></div>
      <div class="phone-body"><span class="when">Today 9:14 AM</span>
        ${msg.banner ? `<div class="chat-banner">${P(msg.banner)}</div>` : ""}${bubbles}</div>
      ${ctx ? `<div class="statusbar">Point at a link to see where it really goes</div>` : ""}
    </div>`;
  }
  if (msg.kind === "call" || msg.kind === "talk") {
    const talk = msg.kind === "talk";
    const lines = msg.lines.map(l => `<li class="line ${l.who === "You" ? "you" : "caller"}"><span class="who">${l.who}</span><p>${P(l.t)}</p></li>`).join("");
    return `<div class="mock call${play}">
      <div class="call-top"><span class="call-avatar">${icon(talk ? "family" : "phone")}</span><div class="call-id">${talk ? esc(msg.place) : P(msg.callerId)}</div><small>${talk ? "In person · what was said" : "Phone call · transcript"}</small></div>
      <ol class="transcript">${lines}</ol></div>`;
  }
  if (msg.kind === "popup") {
    return `<div class="mock popup"><div class="popup-bar">${icon("alert")}${msg.title}</div>
      <div class="popup-body">${msg.body.map(p => `<p>${p}</p>`).join("")}<span class="fakebtn">OK</span></div></div>`;
  }
  return "";
}

/* ================= components ================= */
function renderQuiz(q, compact) {
  const a = state.quiz[q.id];
  const answered = a !== undefined && a !== null;
  const opts = q.options.map((o, i) => {
    let cls = "";
    if (answered) { if (o.ok) cls = "right"; else if (i === a) cls = "wrong"; }
    return `<button type="button" class="opt ${cls}" data-q="${q.id}" data-o="${i}" ${answered ? "disabled" : ""}>
      <span class="letter">${answered && o.ok ? icon("check") : answered && i === a ? icon("x") : "ABCD"[i]}</span><span>${o.t}</span></button>`;
  }).join("");
  let fb = "";
  if (answered) {
    const chosen = q.options[a], right = q.options.find(o => o.ok);
    fb = chosen.ok
      ? `<div class="fbcard good"><span class="fbi">${icon("check")}</span><div><strong>Correct!</strong><p>${chosen.why}</p></div></div>`
      : `<div class="fbcard bad"><span class="fbi">${icon("x")}</span><div><strong>Not quite.</strong><p>${chosen.why}</p><p><b>Best answer:</b> ${right.t}. ${right.why}</p></div></div>`;
  }
  return `<div class="quiz" id="quiz-${q.id}">
    <p class="q-label">${icon("star")}${q.label || "Quick check"}</p>
    ${q.context ? `<p class="q-context">${q.context}</p>` : ""}
    ${q.mock ? renderMsg(q.mock, null) : ""}
    <h3 class="q">${q.q}</h3>
    <div class="opts">${opts}</div>
    <div class="qfb" aria-live="polite">${fb}</div>
  </div>`;
}

function renderSpotPanel(s) {
  const st = spotState(s.id);
  const keys = Object.keys(s.flags);
  const total = keys.length, got = st.found.length;
  const missed = st.revealed ? keys.filter(k => !st.found.includes(k)) : [];
  const dots = keys.map((_, i) => `<span class="dot ${i < got ? "on" : (st.revealed ? "miss" : "")}"></span>`).join("");
  let items = st.found.map((k, i) => `<li data-flag="${k}"><span class="num">${i + 1}</span><div><strong>${s.flags[k].title}</strong><p>${s.flags[k].why}</p></div></li>`).join("");
  items += missed.map((k, i) => `<li class="miss" data-flag="${k}"><span class="num">${got + i + 1}</span><div><strong>${s.flags[k].title}<span class="tag">Missed</span></strong><p>${s.flags[k].why}</p></div></li>`).join("");
  if (!st.revealed) for (let i = got; i < total; i++) items += `<li class="todo"><span class="num">?</span><span>Not found yet</span></li>`;
  let fb = lastFb[s.id];
  if (!fb) {
    if (got === total) fb = `<div class="fbcard good"><span class="fbi">${icon("trophy")}</span><div><strong>You found every red flag!</strong><p>Great eye. Press Next to continue.</p></div></div>`;
    else if (st.revealed) fb = `<div class="fbcard"><span class="fbi">${icon("eye")}</span><div><strong>All red flags are showing</strong><p>Orange highlights are the ones you missed. Point at any highlight to read why.</p></div></div>`;
    else fb = `<div class="fbcard"><span class="fbi">${icon("cursor")}</span><div><strong>Find ${total} red flags</strong><p>Click or tap on anything in the ${s.msg.kind === "call" ? "call" : s.msg.kind === "talk" ? "conversation" : "message"} that looks suspicious.</p></div></div>`;
  }
  return `<div class="panel">
    <div class="tally"><strong>Red flags found: ${got} of ${total}</strong><div class="dots" aria-hidden="true">${dots}</div></div>
    <div class="fb" aria-live="polite">${fb}</div>
    <ol class="flaglist">${items}</ol>
    <div class="btn-row"><button type="button" class="btn" data-act="reveal" ${st.revealed || got === total ? "disabled" : ""}>${icon("eye")}Show me the red flags</button></div>
  </div>`;
}

/* ================= slide rendering ================= */
const stage = $("#stage");

function slideHead(s) {
  const eb = `<span class="pill">${sectionPos(s) || "Finished"}</span>`;
  return `<div class="slide-head"><p class="eyebrow">${eb}</p><h1>${s.title}</h1>${s.lead ? `<p class="lead">${s.lead}</p>` : ""}</div>`;
}

function renderSlide(keepScroll) {
  const s = SLIDES[state.idx];
  const top = stage.scrollTop;
  ctxs = {};
  let html = slideHead(s);
  if (s.kind === "lesson") {
    const aside = s.quizzes ? `<aside>${s.quizzes.map(q => renderQuiz(q)).join("")}</aside>` : "";
    html += `<div class="lesson${aside ? " has-aside" : ""}"><div class="prose">${s.body()}</div>${aside}</div>`;
  } else if (s.kind === "anatomy") {
    const ctx = ctxs[s.id] = { mode:"learn", slide:s, segs:[], nums:numbering(s) };
    const legend = Object.entries(s.flags).map(([k, f], i) => `<li tabindex="0" data-flag="${k}"><span class="num">${i + 1}</span><div><strong>${f.title}</strong><p>${f.why}</p></div></li>`).join("");
    html += `<div class="lesson has-aside"><div class="prose">${renderMsg(s.msg, ctx)}
      <div class="panel"><h2>What to look for</h2><ol class="legend">${legend}</ol></div></div>
      <aside>${s.quizzes.map(q => renderQuiz(q)).join("")}</aside></div>`;
  } else if (s.kind === "spot") {
    const ctx = ctxs[s.id] = { mode:"play", slide:s, segs:[], nums:numbering(s) };
    html += `<div class="scenario">${icon("info")}<p>${s.scenario}</p></div>
      <div class="practice"><div>${renderMsg(s.msg, ctx)}</div>${renderSpotPanel(s)}</div>`;
  } else if (s.kind === "quizset") {
    html += `<div class="quizgrid">${s.quizzes.map(q => renderQuiz(q)).join("")}</div>`;
  } else if (s.kind === "results") {
    html += renderResults("final");
  } else if (s.kind === "checkpoint") {
    html += renderResults("checkpoint");
  }
  stage.innerHTML = `<div class="slide gut"><div class="wrap">${html}</div></div>`;
  if (s.id === "welcome") renderResume();
  stage.scrollTop = keepScroll ? top : 0;
  updateChrome();
}

function renderResume() {
  const box = $("#resumeBox");
  if (!box) return;
  const answered = Object.keys(state.quiz).length + Object.keys(state.spot).length;
  if (savedIdx > 0 && savedIdx < SLIDES.length && answered) {
    box.innerHTML = `<div class="note">${icon("redo")}<div style="display:grid;gap:.6rem"><p><b>Welcome back!</b> You stopped at “${SLIDES[savedIdx].title}”.</p>
      <div class="btn-row"><button type="button" class="btn solid" data-act="goto" data-id="${SLIDES[savedIdx].id}">Continue where I left off</button></div></div></div>`;
  }
}

/* ================= results ================= */
// sections: optional list of section names to count (default: whole course)
function tally(sections) {
  const c = {}; Object.keys(CONCEPTS).forEach(k => c[k] = { earned:0, possible:0 });
  const lessonQ = [0, 0], pracQ = [0, 0], flags = [0, 0], travel = [0, 0];
  let misses = 0, attempted = 0;
  SLIDES.forEach(s => {
    if (sections && !sections.includes(s.section)) return;
    (s.quizzes || []).forEach(q => {
      const a = state.quiz[q.id];
      const ok = a !== undefined && a !== null && q.options[a].ok;
      if (a !== undefined && a !== null) attempted++;
      c[q.concept].possible++; if (ok) c[q.concept].earned++;
      const b = s.section === "learn" ? lessonQ : s.section === "travel" ? travel : pracQ; b[1]++; if (ok) b[0]++;
    });
    if (s.kind === "spot") {
      const st = state.spot[s.id] || { found:[], misses:0 };
      if (st.found.length || st.revealed || st.misses) attempted++;
      const b = s.section === "travel" ? travel : flags;
      Object.entries(s.flags).forEach(([k, f]) => {
        c[f.concept].possible++; b[1]++;
        if (st.found.includes(k)) { c[f.concept].earned++; b[0]++; }
      });
      misses += st.misses || 0;
    }
  });
  const earned = lessonQ[0] + pracQ[0] + flags[0] + travel[0], possible = lessonQ[1] + pracQ[1] + flags[1] + travel[1];
  return { c, lessonQ, pracQ, flags, travel, misses, earned, possible, attempted, pct: possible ? Math.round(earned / possible * 100) : 0 };
}

// mode: "final" (whole course) or "checkpoint" (Parts 1 and 2 only, shown before the travel section)
function renderResults(mode = "final") {
  const half = mode === "checkpoint";
  const t = tally(half ? ["learn", "practice"] : null);
  const R = 52, C = 2 * Math.PI * R;
  let headline, msg;
  if (t.pct >= 85) { headline = half ? "Excellent! You’re spotting scam messages and calls like a pro." : "Excellent! You have a sharp eye for scams."; msg = "You spotted most of the tricks scammers use. Share what you’ve learned with friends and family."; }
  else if (t.pct >= 65) { headline = "Good work. You’re well on your way."; msg = "You caught many of the warning signs. Look over the topics below marked for review, then try the practice again."; }
  else { headline = "A good start. Practice makes perfect."; msg = "Every scam you learn to recognize is one you won’t fall for. Review the lessons below and try the practice again."; }
  if (!t.attempted) { headline = "You haven’t answered any questions yet."; msg = half ? "Go back through the lessons and practice, then return here to see how you did." : "Go back through the lessons and practice, then return here for your score."; }
  const rows = Object.entries(t.c).filter(([, v]) => v.possible).map(([k, v]) => ({ k, ...v, pct: Math.round(v.earned / v.possible * 100) }));
  const strong = rows.filter(r => r.pct >= 80).sort((a, b) => b.pct - a.pct);
  const weak = rows.filter(r => r.pct < 80).sort((a, b) => a.pct - b.pct);
  const row = r => {
    const lvl = r.pct >= 80 ? "" : r.pct >= 60 ? "mid" : "low";
    const label = r.pct >= 80 ? "Strong" : r.pct >= 60 ? "Getting there" : "Review";
    const btns = r.pct < 80 ? `<div class="btn-row">${CONCEPTS[r.k].lessons.map(id => `<button type="button" class="btn" data-act="goto" data-id="${id}">${icon("book")}Review: ${SLIDES[idxOf(id)].title}</button>`).join("")}</div>` : "";
    return `<div class="crow ${lvl}"><div class="crow-top"><b>${CONCEPTS[r.k].name}</b><span><span class="status">${label}</span> ${r.earned} of ${r.possible}</span></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div><p>${CONCEPTS[r.k].about}</p>${btns}</div>`;
  };
  return `
  <div class="score-hero">
    <svg class="ring" viewBox="0 0 128 128" role="img" aria-label="Score ${t.pct} percent">
      <circle class="track" cx="64" cy="64" r="${R}"/><circle class="val" cx="64" cy="64" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - t.pct / 100)).toFixed(1)}"/>
      <text x="64" y="64">${t.pct}%</text></svg>
    <div class="score-copy"><h2>${headline}</h2><p>${msg}</p><p class="where">${half ? "Parts 1 and 2 (emails, texts, chat apps and phone calls): " : "Whole course: "}you earned ${t.earned} of ${t.possible} points.</p></div>
  </div>
  <div class="stats">
    <div class="stat"><b>${t.lessonQ[0]} / ${t.lessonQ[1]}</b><span>Lesson questions correct</span></div>
    <div class="stat"><b>${t.flags[0]} / ${t.flags[1]}</b><span>Red flags found</span></div>
    <div class="stat"><b>${t.pracQ[0]} / ${t.pracQ[1]}</b><span>Practice questions correct</span></div>
    ${half ? "" : `<div class="stat"><b>${t.travel[0]} / ${t.travel[1]}</b><span>Travel points (questions and red flags)</span></div>`}
    <div class="stat"><b>${t.misses}</b><span>Safe parts clicked by mistake</span></div>
  </div>
  <div class="res-cols">
    <div class="res-group"><h2>${icon("check")}What you understand well</h2>${strong.length ? strong.map(row).join("") : `<p class="empty">Nothing here yet. Keep practicing!</p>`}</div>
    <div class="res-group"><h2>${icon("book")}Worth reviewing</h2>${weak.length ? weak.map(row).join("") : `<p class="empty">Nothing to review. You did well in every topic!</p>`}</div>
  </div>
  <div class="res-cols">
    <div class="res-group"><h2>${icon("shield")}Remember the four habits</h2>
      <div class="rules"><div class="rule"><span class="word">Stop</span></div><div class="rule"><span class="word">Check</span></div><div class="rule"><span class="word">Talk</span></div><div class="rule"><span class="word">Report</span></div></div></div>
    ${half ? `<div class="res-group"><h2>${icon("arrow")}Next up: scams when you travel</h2>
      <p>Part 3 covers in-person scams that target U.S. travelers abroad. It’s scored separately and included in your final results.</p>
      <div class="btn-row"><button type="button" class="btn solid" data-act="goto" data-id="travel-intro">Continue to travel scams</button>
      <button type="button" class="btn" data-act="retry" data-scope="practice">Redo the practice exercises</button></div></div>`
    : `<div class="res-group"><h2>${icon("redo")}Try again</h2>
      <div class="btn-row"><button type="button" class="btn solid" data-act="retry">Redo all practice exercises</button>
      <button type="button" class="btn" data-act="restart">Start over from the beginning</button></div>
      <div id="confirmBox"></div></div>`}
  </div>`;
}

/* ================= interactions ================= */
function go(i) {
  if (i < 0 || i >= SLIDES.length) return;
  stopSpeech(); hideTip();
  if (i > 0) savedIdx = 0;
  state.idx = i; save(); renderSlide(false);
  stage.focus({ preventScroll:true });
}

function answerQuiz(qid, o) {
  if (state.quiz[qid] !== undefined && state.quiz[qid] !== null) return;
  state.quiz[qid] = o; save();
  const q = QUIZ[qid];
  const el = $("#quiz-" + qid);
  if (el) {
    const btn = el.querySelector(`[data-o="${o}"]`);
    if (btn) popAt(btn, q.options[o].ok, q.options[o].ok ? "Correct!" : "Not quite");
    el.outerHTML = renderQuiz(q);
    const fb = $("#quiz-" + qid + " .qfb");
    if (fb && fb.getBoundingClientRect().bottom > window.innerHeight - 80) fb.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }
  updateChrome();
}

function spotClick(el) {
  const s = SLIDES[state.idx];
  const ctx = ctxs[s.id];
  if (!ctx) return;
  const k = +el.dataset.k;
  const seg = ctx.segs[k];
  const st = spotState(s.id);
  const total = Object.keys(s.flags).length;
  if (st.revealed || st.found.length === total) {
    if (el.dataset.tip) showTip(el);
    else lastFb[s.id] = `<div class="fbcard"><span class="fbi">${icon("info")}</span><div><strong>This part is fine</strong><p>${seg.ok || "That part of the message isn’t one of the red flags."}</p></div></div>`;
    if (!el.dataset.tip) refreshSpot(k);
    return;
  }
  if (seg.flag) {
    const f = s.flags[seg.flag];
    if (st.found.includes(seg.flag)) {
      lastFb[s.id] = `<div class="fbcard"><span class="fbi">${icon("info")}</span><div><strong>You already found this one</strong><p>${f.title}. Keep looking for the others.</p></div></div>`;
    } else {
      st.found.push(seg.flag);
      const n = st.found.length;
      const done = n === total;
      popAt(el, true, `Red flag! ${f.title}`);
      lastFb[s.id] = `<div class="fbcard good"><span class="fbi">${icon("check")}</span><div><strong>Yes! Red flag #${n}: ${f.title}</strong><p>${f.why}</p>${done ? `<p><b>You found all ${total}!</b> Great eye. Press Next to continue.</p>` : ""}</div></div>`;
    }
  } else {
    st.misses = (st.misses || 0) + 1;
    popAt(el, false, "Not a red flag");
    lastFb[s.id] = `<div class="fbcard bad"><span class="fbi">${icon("x")}</span><div><strong>Not a red flag</strong><p>${seg.ok || "That part looks normal. Keep looking. Check who it’s really from, any links, deadlines or threats, and what they want you to do or pay."}</p></div></div>`;
    el.classList.add("flash");
  }
  save();
  const flashed = !seg.flag;
  setTimeout(() => refreshSpot(k), flashed ? 450 : 0);
}

function refreshSpot(k) {
  renderSlide(true);
  const el = stage.querySelector(`[data-k="${k}"]`);
  if (el) el.focus({ preventScroll:true });
}

function popAt(el, ok, text) {
  const r = el.getBoundingClientRect();
  const p = document.createElement("div");
  p.className = "pop" + (ok ? "" : " bad");
  p.innerHTML = icon(ok ? "check" : "x") + `<span>${esc(text)}</span>`;
  const x = Math.min(Math.max(r.left + Math.min(r.width, 300) / 2, 120), window.innerWidth - 120);
  p.style.left = x + "px";
  p.style.top = Math.max(r.top, 50) + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 2000);
}

stage.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) { answerQuiz(opt.dataset.q, +opt.dataset.o); return; }
  const seg = e.target.closest(".play .seg[data-k]");
  if (seg) { if (seg.dataset.url) setStatus(seg, true); spotClick(seg); return; }
  const act = e.target.closest("[data-act]");
  if (act) { doAct(act); return; }
  const urlEl = e.target.closest("[data-url]");
  if (urlEl) setStatus(urlEl, true);
});

function doAct(btn) {
  const a = btn.dataset.act;
  const s = SLIDES[state.idx];
  if (a === "reveal") { spotState(s.id).revealed = true; delete lastFb[s.id]; save(); renderSlide(true); }
  else if (a === "goto") go(idxOf(btn.dataset.id));
  else if (a === "retry") {
    const scope = btn.dataset.scope;
    SLIDES.filter(p => (p.kind === "spot" || p.kind === "quizset") && (!scope || p.section === scope)).forEach(p => { delete state.spot[p.id]; delete lastFb[p.id]; (p.quizzes || []).forEach(q => delete state.quiz[q.id]); });
    save(); go(idxOf("practice-intro"));
  }
  else if (a === "restart") {
    $("#confirmBox").innerHTML = `<div class="confirm"><span>This erases all your answers. Are you sure?</span>
      <button type="button" class="btn solid" data-act="confirm-restart">Yes, start over</button><button type="button" class="btn" data-act="cancel-restart">Cancel</button></div>`;
  }
  else if (a === "confirm-restart") { state.quiz = {}; state.spot = {}; Object.keys(lastFb).forEach(k => delete lastFb[k]); save(); go(0); }
  else if (a === "cancel-restart") { $("#confirmBox").innerHTML = ""; }
}

/* status bar for links */
function setStatus(el, on) {
  const box = el.closest(".mock, .demo");
  const bar = box && box.querySelector(".statusbar");
  if (!bar) return;
  if (on) { bar.textContent = "This link really goes to:  " + el.dataset.url; bar.classList.add("on"); }
  else { bar.textContent = box.classList.contains("demo") ? "Point at the button to see where it really goes" : "Point at a link to see where it really goes"; bar.classList.remove("on"); }
}

/* tooltips */
const tip = $("#tip");
let tipOwner = null;
function showTip(el) {
  const t = el.dataset.tip; if (!t) return;
  const title = el.dataset.tipTitle;
  tip.innerHTML = (title ? `<strong>${esc(title)}</strong>` : "") + `<span>${esc(t)}</span>`;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const x = Math.min(Math.max(12, r.left + Math.min(r.width, 400) / 2 - tw / 2), window.innerWidth - tw - 12);
  let y = r.top - th - 10;
  if (y < 8) y = r.bottom + 10;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  tipOwner = el;
}
function hideTip() { tip.hidden = true; tipOwner = null; }

document.addEventListener("pointerover", e => {
  const u = e.target.closest && e.target.closest("[data-url]");
  if (u) setStatus(u, true);
  const li = e.target.closest && e.target.closest(".legend li[data-flag], .flaglist li[data-flag]");
  if (li) $$(`.seg[data-flag="${li.dataset.flag}"]`, stage).forEach(s => s.classList.add("lit"));
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el && el !== tipOwner) showTip(el);
});
document.addEventListener("pointerout", e => {
  const u = e.target.closest && e.target.closest("[data-url]");
  if (u && !u.contains(e.relatedTarget)) setStatus(u, false);
  const li = e.target.closest && e.target.closest(".legend li[data-flag], .flaglist li[data-flag]");
  if (li && !li.contains(e.relatedTarget)) $$(".seg.lit", stage).forEach(s => s.classList.remove("lit"));
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el && el === tipOwner && !el.contains(e.relatedTarget)) hideTip();
});
document.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el) showTip(el); else hideTip();
  const li = e.target.closest && e.target.closest(".legend li[data-flag]");
  $$(".seg.lit", stage).forEach(s => s.classList.remove("lit"));
  if (li) $$(`.seg[data-flag="${li.dataset.flag}"]`, stage).forEach(s => s.classList.add("lit"));
});
document.addEventListener("click", e => {
  // tap support for touch screens
  const el = e.target.closest("[data-tip]");
  if (el) { if (tipOwner === el && e.pointerType !== "mouse" && !el.closest(".play")) hideTip(); else showTip(el); }
  else if (!e.target.closest("#tip")) hideTip();
});
stage.addEventListener("scroll", hideTip, { passive:true });
window.addEventListener("resize", hideTip);

document.addEventListener("keydown", e => {
  if (!$("#drawer").hidden) { if (e.key === "Escape") closeToc(); return; }
  const seg = e.target.closest && e.target.closest(".play .seg[data-k], .fakebtn[data-url], [data-tip][tabindex]");
  if (seg && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    if (seg.matches(".play .seg[data-k]")) spotClick(seg);
    else if (seg.dataset.url) setStatus(seg, true);
    else showTip(seg);
    return;
  }
  if (e.key === "Escape") hideTip();
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(state.idx + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(state.idx - 1); }
});

/* ================= chrome: nav, progress, toc, text size, speech ================= */
const backBtn = $("#back"), nextBtn = $("#next");
backBtn.innerHTML = icon("left") + "Back";
$("#brandMark").innerHTML = icon("shield");
$("#openToc").innerHTML = icon("list") + `<span class="lbl">All slides</span>`;
backBtn.addEventListener("click", () => go(state.idx - 1));
nextBtn.addEventListener("click", () => go(state.idx + 1));

function slideDone(s) {
  if (s.kind === "spot") { const st = state.spot[s.id]; return !!st && (st.revealed || st.found.length === Object.keys(s.flags).length); }
  if (s.quizzes) return s.quizzes.every(q => state.quiz[q.id] !== undefined && state.quiz[q.id] !== null);
  return false;
}

function updateChrome() {
  const s = SLIDES[state.idx];
  const i = state.idx;
  backBtn.disabled = i === 0;
  nextBtn.hidden = i === SLIDES.length - 1;
  const nextS = SLIDES[i + 1];
  let label = "Next";
  if (i === 0) label = "Start";
  else if (nextS && nextS.kind === "results") label = "See my score";
  else if (nextS && nextS.kind === "checkpoint") label = "See how I did";
  else if (nextS && nextS.id === "practice-intro") label = "Start practice";
  else if (nextS && nextS.id === "travel-intro") label = "Travel scams";
  nextBtn.innerHTML = label + icon("right");
  $("#where").textContent = sectionPos(s) || "Your results";
  $("#bar").style.width = (i / (SLIDES.length - 1) * 100) + "%";
  const scored = s.kind === "spot" || s.kind === "quizset" || !!s.quizzes;
  $("#navHint").textContent = scored && !slideDone(s) ? "You can skip and come back to this later" : "Tip: you can also use the arrow keys";
  document.title = "Spot the Scam";
}

function renderToc() {
  const group = (title, list) => `<h3>${title}</h3><ul class="toc">${list.map(s => {
    const i = SLIDES.indexOf(s);
    const done = slideDone(s);
    return `<li><button type="button" data-goto="${i}" ${i === state.idx ? 'aria-current="true"' : ""}><span class="st ${done ? "done" : ""}">${done ? icon("check") : ""}</span><span>${s.title}</span></button></li>`;
  }).join("")}</ul>`;
  $("#tocBody").innerHTML = group("Part 1 · Learn", LEARN) + group("Part 2 · Practice", SLIDES.filter(s => s.section === "practice" || s.section === "checkpoint")) + group("Part 3 · Traveling abroad", TRAVEL) + group("Finish", SLIDES.filter(s => s.section === "results"));
}
function openToc() { renderToc(); $("#drawer").hidden = false; $("#closeToc").focus(); }
function closeToc() { $("#drawer").hidden = true; $("#openToc").focus(); }
$("#openToc").addEventListener("click", openToc);
$("#closeToc").addEventListener("click", closeToc);
$("#drawer").addEventListener("click", e => {
  const b = e.target.closest("[data-goto]");
  if (b) { $("#drawer").hidden = true; go(+b.dataset.goto); return; }
  if (e.target.id === "drawer") closeToc();
});

const SCALES = [0.9, 1, 1.15, 1.3, 1.5];
function applyScale() {
  if (!SCALES.includes(state.scale)) state.scale = 1;
  document.documentElement.style.setProperty("--scale", state.scale);
  $("#smaller").disabled = state.scale === SCALES[0];
  $("#bigger").disabled = state.scale === SCALES[SCALES.length - 1];
}
$("#smaller").addEventListener("click", () => { state.scale = SCALES[Math.max(0, SCALES.indexOf(state.scale) - 1)]; applyScale(); save(); });
$("#bigger").addEventListener("click", () => { state.scale = SCALES[Math.min(SCALES.length - 1, SCALES.indexOf(state.scale) + 1)]; applyScale(); save(); });

const speakBtn = $("#speak");
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function setSpeakBtn(on) {
  speakBtn.setAttribute("aria-pressed", on ? "true" : "false");
  speakBtn.innerHTML = icon(on ? "stop" : "speaker") + `<span class="lbl">${on ? "Stop reading" : "Read aloud"}</span>`;
}
function stopSpeech() { if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } setSpeakBtn(false); }
if (canSpeak) {
  speakBtn.hidden = false; setSpeakBtn(false);
  speakBtn.addEventListener("click", () => {
    if (speakBtn.getAttribute("aria-pressed") === "true") { stopSpeech(); return; }
    const text = (stage.innerText || "").replace(/\s+\n/g, "\n").slice(0, 6000);
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9;
      u.onend = u.onerror = () => setSpeakBtn(false);
      speechSynthesis.cancel(); speechSynthesis.speak(u); setSpeakBtn(true);
    } catch (e) { setSpeakBtn(false); }
  });
}

applyScale();
renderSlide(false);
</script>
