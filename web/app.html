<title>Spot the Scam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive course that teaches you to recognize scam emails, texts, chat messages and phone calls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen slide course. Slim top bar with progress, one readable column per slide
   (lesson + quiz side by side on wide screens), large Back / Next bar pinned at the bottom.
   Type: Atkinson Hyperlegible (made for low-vision readers) for text, Lexend for headings. */
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#14213D; --muted:#4A5670; --line:#D2DAE6;
  --primary:#1E3A8A; --primary-ink:#FFFFFF; --primary-soft:#E2E9F7;
  --flag:#B45309; --flag-soft:#FDEFC8; --flag-line:#E39B2D;
  --good:#166534; --good-soft:#DAF1E2; --bad:#B42318; --bad-soft:#FBE3DF;
  --on-solid:#FFFFFF;
  --bubble-in:#E8ECF2; --bubble-out:#2747A8; --bubble-out-ink:#FFFFFF;
  --chat-bg:#E7EFE6; --chat-in:#FFFFFF; --chat-out:#D3EFCB;
  --mock-btn:#2B5BD7; --mock-btn-ink:#FFFFFF; --frame:#1B2438;
  --call-top:#1B2A4A; --call-ink:#F2F5FB;
  --scrim:rgb(15 23 42 / .45);
  --shadow:0 1px 2px rgb(20 33 61 / .06), 0 10px 28px rgb(20 33 61 / .09);
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-display:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --surface:#162036; --ink:#E7ECF6; --muted:#A6B1C7; --line:#2B3955;
    --primary:#93B2FF; --primary-ink:#0E1524; --primary-soft:#1F2D4F;
    --flag:#F2A93B; --flag-soft:#3A2A10; --flag-line:#D18B23;
    --good:#5BD38A; --good-soft:#12321F; --bad:#FF8B7B; --bad-soft:#3E1B17;
    --on-solid:#0E1524;
    --bubble-in:#24304A; --bubble-out:#3B5BC4; --bubble-out-ink:#FFFFFF;
    --chat-bg:#101B16; --chat-in:#1E2A38; --chat-out:#1E4931;
    --mock-btn:#3B6FE0; --mock-btn-ink:#FFFFFF; --frame:#2B3955;
    --call-top:#0A1121; --call-ink:#F2F5FB;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --surface:#162036; --ink:#E7ECF6; --muted:#A6B1C7; --line:#2B3955;
  --primary:#93B2FF; --primary-ink:#0E1524; --primary-soft:#1F2D4F;
  --flag:#F2A93B; --flag-soft:#3A2A10; --flag-line:#D18B23;
  --good:#5BD38A; --good-soft:#12321F; --bad:#FF8B7B; --bad-soft:#3E1B17;
  --on-solid:#0E1524;
  --bubble-in:#24304A; --bubble-out:#3B5BC4; --bubble-out-ink:#FFFFFF;
  --chat-bg:#101B16; --chat-in:#1E2A38; --chat-out:#1E4931;
  --mock-btn:#3B6FE0; --mock-btn-ink:#FFFFFF; --frame:#2B3955;
  --call-top:#0A1121; --call-ink:#F2F5FB;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:calc(18px * var(--scale))}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flag-line);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:72rem;margin-inline:auto;width:100%}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem 1rem;padding-block:.55rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand-mark{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--primary);color:var(--primary-ink)}
.where{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tools{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:.4rem;min-height:2.6rem;padding:.3rem .8rem;border:1px solid var(--line);background:var(--surface);border-radius:.6rem;font-size:.9rem;cursor:pointer}
.tbtn:hover{border-color:var(--primary);background:var(--primary-soft)}
.tbtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tbtn .big{font-weight:700;font-size:1.1em}
.progress{height:6px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--primary);transition:width .35s ease}

/* ---------- stage ---------- */
#stage{overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.slide{padding-block:1.75rem 3rem}
.slide-head{display:grid;gap:.5rem;margin-bottom:1.5rem;max-width:52rem}
.eyebrow{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--primary);display:flex;align-items:center;gap:.5rem}
.eyebrow .pill{background:var(--primary-soft);padding:.15rem .6rem;border-radius:99px}
.slide h1{font-size:clamp(1.6rem, 1.1rem + 2vw, 2.35rem);font-weight:700;letter-spacing:-.015em}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.prose{display:grid;gap:1rem;min-width:0}
.prose>p,.prose li{max-width:65ch}
.prose ul{margin:0;padding-left:1.25rem;display:grid;gap:.4rem}
.prose h2{font-size:1.25rem;margin-top:.5rem}
.lesson{display:grid;gap:2rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){
  .lesson.has-aside{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
  .lesson.has-aside>aside{position:sticky;top:1rem;align-self:start}
}
aside{display:grid;gap:1.25rem;min-width:0}
.term{border-bottom:2px dotted var(--primary);cursor:help;border-radius:2px}
.term:hover{background:var(--primary-soft)}
.note{display:flex;gap:.75rem;align-items:flex-start;background:var(--primary-soft);padding:.9rem 1rem;border-radius:.8rem;max-width:65ch}
.note .ic{color:var(--primary);margin-top:.15rem}
.note.warn{background:var(--flag-soft)}
.note.warn .ic{color:var(--flag)}

.cards{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1rem 1.1rem;display:grid;gap:.45rem;align-content:start}
.card h3{font-size:1.05rem;display:flex;align-items:center;gap:.6rem}
.card p{color:var(--muted);font-size:.95rem}
.icon-dot{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--primary-soft);color:var(--primary);flex:none}
.card[data-tip]{cursor:help}
.card[data-tip]:hover,.card[data-tip]:focus-visible{border-color:var(--primary)}
.hint{font-size:.85rem;color:var(--primary);font-weight:700;display:flex;gap:.35rem;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.chip[data-tip]{cursor:help}
.chip[data-tip]:hover{border-color:var(--primary)}

.flow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:stretch}
.step{flex:1 1 11rem;background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.9rem 1rem;display:grid;gap:.3rem}
.step b{font-family:var(--font-display);color:var(--primary);font-size:.85rem;text-transform:uppercase;letter-spacing:.07em}
.flow .arr{align-self:center;color:var(--muted)}
@media (max-width:640px){.flow{flex-direction:column}.flow .arr{transform:rotate(90deg);align-self:center}}

.tiers{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1rem;display:grid;gap:.5rem;align-content:start}
.tier .reach{display:flex;gap:3px;flex-wrap:wrap}
.tier .reach i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.tier .reach i.on{background:var(--flag-line)}

.checklist{list-style:none;margin:0;padding:0;display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.checklist li{display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.8rem .9rem;cursor:help}
.checklist li:hover,.checklist li:focus-visible{border-color:var(--flag-line)}
.checklist .ic{color:var(--flag);margin-top:.1rem}
.checklist strong{display:block}
.checklist span{color:var(--muted);font-size:.92rem}

.rules{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1.1rem;display:grid;gap:.4rem;align-content:start}
.rule .word{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--primary);letter-spacing:-.01em}
.rule p{color:var(--muted)}
.report{display:grid;gap:.5rem}
.report-row{display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line)}
.report-row b{min-width:12rem}
.mono{font-family:var(--font-mono);font-size:.95em;overflow-wrap:anywhere}

/* URL anatomy */
.url-box{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1rem;overflow-x:auto}
.url{font-family:var(--font-mono);font-size:1.15rem;white-space:nowrap;display:inline-flex}
.url span{padding:.2rem .1rem;border-radius:.25rem}
.u-dim{color:var(--muted)}
.u-own{background:var(--good-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--good)}
.u-bad{background:var(--bad-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--bad)}
.u-fake{background:var(--flag-soft);color:var(--ink)}
.url-legend{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;margin-top:.75rem;font-size:.9rem;color:var(--muted)}
.url-legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:.2rem;vertical-align:-.1rem;margin-right:.35rem}
.urlrows{display:grid;gap:.5rem}
.urlrow{display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:.7rem;padding:.65rem .9rem;cursor:help}
.urlrow:hover,.urlrow:focus-visible{border-color:var(--primary)}
.urlrow .mono{font-size:1rem}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;overflow:hidden}
.demo-body{padding:1.1rem;display:grid;gap:.75rem;justify-items:start}

/* ---------- message mock-ups ---------- */
.mock{background:var(--surface);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.mock-label{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem 1rem;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--line)}
.eh{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:.3rem .75rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line);font-size:.95rem}
.eh .lab{color:var(--muted)}
.eh>span{overflow-wrap:anywhere;min-width:0}
.eh .subj{font-weight:700}
.email-body{padding:1.1rem;display:grid;gap:.85rem;overflow-wrap:anywhere}
.email-foot{font-size:.82rem;color:var(--muted)}
.fakebtn{display:inline-block;background:var(--mock-btn);color:var(--mock-btn-ink);padding:.6rem 1.3rem;border-radius:.4rem;font-weight:700;cursor:pointer}
.attach{display:inline-flex;gap:.5rem;align-items:center;border:1px solid var(--line);border-radius:.5rem;padding:.5rem .8rem;background:var(--paper);font-size:.95rem}
.statusbar{font-family:var(--font-mono);font-size:.82rem;background:var(--paper);border-top:1px solid var(--line);padding:.5rem 1rem;color:var(--muted);overflow-wrap:anywhere;min-height:2.2rem}
.statusbar.on{color:var(--ink);background:var(--flag-soft)}
.lnk{color:var(--mock-btn);text-decoration:underline;overflow-wrap:anywhere}
.bub.out .lnk{color:inherit}

.phone{max-width:25rem;border:9px solid var(--frame);border-radius:2rem;margin-inline:auto;width:100%}
.phone-top{display:grid;justify-items:center;gap:.2rem;padding:.9rem 1rem .7rem;border-bottom:1px solid var(--line);text-align:center}
.avatar{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--bubble-in);color:var(--muted)}
.phone-sender{font-weight:700;overflow-wrap:anywhere}
.phone-top small{color:var(--muted);font-size:.8rem}
.phone-body{display:flex;flex-direction:column;gap:.55rem;padding:1rem .9rem}
.bub{max-width:88%;padding:.6rem .85rem;border-radius:1.1rem;background:var(--bubble-in);overflow-wrap:anywhere;border-bottom-left-radius:.35rem}
.bub.out{margin-left:auto;background:var(--bubble-out);color:var(--bubble-out-ink);border-bottom-left-radius:1.1rem;border-bottom-right-radius:.35rem}
.when{align-self:center;font-size:.75rem;color:var(--muted)}
.chat .phone-body{background:var(--chat-bg)}
.chat .bub{background:var(--chat-in);box-shadow:0 1px 1px rgb(0 0 0 / .08)}
.chat .bub.out{background:var(--chat-out);color:var(--ink)}
.chat-banner{align-self:center;text-align:center;font-size:.85rem;background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .8rem;max-width:95%}

.call-top{background:var(--call-top);color:var(--call-ink);display:grid;justify-items:center;gap:.3rem;padding:1.1rem 1rem}
.call-avatar{display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:rgb(255 255 255 / .14)}
.call-id{font-family:var(--font-display);font-size:1.15rem;font-weight:600;text-align:center;white-space:pre-line}
.call-top small{opacity:.8;font-size:.8rem}
.call-top .seg.found,.call-top .seg.missed,.call-top .seg.shown{color:var(--ink)}
.transcript{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.75rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .who{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);padding-top:.2rem}
.line.you{background:var(--paper)}
.line.you .who{color:var(--muted)}
@media (max-width:480px){.line{grid-template-columns:minmax(0,1fr);gap:.15rem}}

.popup .popup-bar{background:var(--bad);color:var(--on-solid);padding:.5rem 1rem;font-weight:700;display:flex;gap:.5rem;align-items:center}
.popup .popup-body{padding:1rem;display:grid;gap:.6rem}
.popup .popup-body .fakebtn{justify-self:start;background:var(--bad)}

/* clickable / highlighted segments */
.seg{border-radius:.25rem;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.05em .08em}
.play .seg{cursor:pointer;transition:background-color .15s}
.play .seg:hover{background:var(--primary-soft);box-shadow:inset 0 -2px 0 var(--primary);color:var(--ink)}
.seg.found{background:var(--good-soft);box-shadow:inset 0 -3px 0 var(--good);color:var(--ink)}
.seg.missed,.seg.shown{background:var(--flag-soft);box-shadow:inset 0 -3px 0 var(--flag-line);color:var(--ink)}
.seg.shown{cursor:help}
.seg.lit{outline:3px solid var(--flag-line);outline-offset:2px}
.seg.flash{background:var(--bad-soft);box-shadow:inset 0 -3px 0 var(--bad)}
.seg[data-n]::after{content:attr(data-n);display:inline-grid;place-items:center;min-width:1.45em;height:1.45em;margin-left:.3em;border-radius:50%;font:700 .72em/1 var(--font-display);background:var(--good);color:var(--on-solid);vertical-align:.18em}
.seg.missed[data-n]::after,.seg.shown[data-n]::after{background:var(--flag)}
.fakebtn .seg.found,.fakebtn .seg.missed,.fakebtn .seg.shown{padding:.1em .2em}

/* ---------- practice layout ---------- */
.scenario{display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);border-radius:.8rem;padding:.8rem 1rem;margin-bottom:1.25rem;max-width:62ch}
.scenario .ic{color:var(--primary);margin-top:.15rem}
.practice{display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){
  .practice{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  .practice .panel{position:sticky;top:1rem;align-self:start}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;display:grid;gap:1rem;min-width:0}
.tally{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.tally strong{font-family:var(--font-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:.35rem;flex-wrap:wrap}
.dot{width:1.05rem;height:1.05rem;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.miss{background:var(--flag-line);border-color:var(--flag-line)}
.fbcard{display:flex;gap:.75rem;align-items:flex-start;padding:.85rem 1rem;border-radius:.8rem;border:2px solid transparent;background:var(--primary-soft)}
.fbcard .fbi{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;flex:none;background:var(--primary);color:var(--primary-ink)}
.fbcard.good{background:var(--good-soft);border-color:var(--good)}
.fbcard.good .fbi{background:var(--good);color:var(--on-solid)}
.fbcard.bad{background:var(--bad-soft);border-color:var(--bad)}
.fbcard.bad .fbi{background:var(--bad);color:var(--on-solid)}
.fbcard strong{display:block;font-family:var(--font-display);margin-bottom:.15rem}
.fbcard p+p{margin-top:.4rem}
.flaglist{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.flaglist li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.65rem;align-items:start}
.flaglist li[data-flag]{cursor:default}
.num{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font:700 .9rem/1 var(--font-display);background:var(--good);color:var(--on-solid)}
.flaglist .todo .num{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.flaglist .todo span{color:var(--muted);padding-top:.25rem}
.flaglist .miss .num,.legend .num{background:var(--flag);color:var(--on-solid)}
.flaglist p,.legend p{color:var(--muted);font-size:.95rem;margin-top:.1rem}
.flaglist .tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--flag);margin-left:.35rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.55rem 1.2rem;border-radius:.75rem;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;cursor:pointer;text-align:center}
.btn:hover:not(:disabled){background:var(--primary-soft)}
.btn.solid{background:var(--primary);color:var(--primary-ink)}
.btn.solid:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.legend li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.65rem;align-items:start;padding:.4rem;border-radius:.6rem;cursor:default}
.legend li:hover,.legend li:focus-visible{background:var(--flag-soft)}

/* ---------- quiz ---------- */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;display:grid;gap:.9rem;align-content:start;min-width:0}
.quiz .mock{box-shadow:none}
.quiz .phone{border-width:6px}
.q-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--flag);display:flex;align-items:center;gap:.4rem}
.q-context{color:var(--muted);font-style:italic}
.q{font-size:1.15rem;font-weight:600}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.75rem;align-items:center;text-align:left;width:100%;padding:.75rem .9rem;min-height:3.3rem;border:2px solid var(--line);border-radius:.8rem;background:var(--surface);cursor:pointer;line-height:1.4}

  <div class="note warn">${icon("alert")}<p>Phishing emails can look perfect, with the real logo and colors. Copying a logo is easy. Don’t judge by how it looks. Judge by <b>what it asks you to do</b>.</p></div>`,
  quizzes:[{ id:"q-phish", concept:"action",
    q:"An email says “Your account is locked. Click here to unlock it.” What is the safest thing to do?",
    options:[
      {t:"Click the link to see if it’s real", ok:false, why:"Clicking can take you to a fake site that steals your login, or install harmful software. Never use the link in a surprise email."},
      {t:"Reply and ask if the email is real", ok:false, why:"Your reply goes straight to the scammer, who will happily say “yes, it’s real”."},
      {t:"Ignore the link. Open the company’s app or type its website yourself, or call the number on your card", ok:true, why:"Right. Going to the company on your own, using a number or website you already know, means you can’t land on a fake."}
    ]}]
},
{ id:"spear", section:"learn", kind:"lesson", title:"Spear phishing and whaling",
  lead:"Some scams are sent to millions of people. Others are aimed at one person, using details about them to seem real.",
  body:() => `
  <div class="tiers">
    <div class="tier"><h3>${icon("hook")} Phishing</h3><div class="reach" aria-label="Sent to many people">${'<i class="on"></i>'.repeat(24)}</div><p>A wide net. The same email goes to millions of people, hoping a few will bite.</p></div>
    <div class="tier"><h3>${icon("target")} Spear phishing</h3><div class="reach" aria-label="Sent to a few people">${'<i class="on"></i>'.repeat(3)}${'<i></i>'.repeat(21)}</div><p>Aimed at you. Uses your name, your job, your church or your grandchildren’s names, often found on ${term("social media","Facebook, Instagram, LinkedIn and similar sites. Scammers read public posts to learn about you and your family.")}.</p></div>
    <div class="tier"><h3>${icon("whale")} Whaling</h3><div class="reach" aria-label="Sent to one important person">${'<i class="on"></i>'}${'<i></i>'.repeat(23)}</div><p>Aimed at the “big fish”: bosses, business owners and people who handle money. Often a fake email from the boss.</p></div>
  </div>
  <h2>The fake boss email</h2>
  <p>A common whaling trick is ${term("Business Email Compromise","Scammers pretend to be a company leader or supplier and ask staff to wire money, change payment details, or buy gift cards. It costs businesses billions every year.","Business Email Compromise (BEC)")}. An email that seems to come from the boss asks an employee to quickly pay an invoice, wire money or buy gift cards, and to keep it quiet.</p>
  <p>Volunteers at clubs, churches and charities get the same trick from the “pastor” or “club president”.</p>`,
  quizzes:[{ id:"q-spear", concept:"impersonation",
    q:"An email that seems to be from your company’s CEO asks you to quietly buy gift cards for clients and email the codes. What is this most likely?",
    options:[
      {t:"A normal request from a busy boss", ok:false, why:"Real companies don’t pay for things with gift card codes sent by email, and real bosses don’t ask you to keep purchases secret."},
      {t:"A whaling scam pretending to be your boss", ok:true, why:"Yes. Gift cards plus secrecy plus “I’m too busy to talk” is a classic fake-boss scam. Check with your boss in person or on a number you already have."},
      {t:"Just an advertisement", ok:false, why:"It’s not an ad. It’s a targeted scam pretending to be someone you work for."}
    ]}]
},
{ id:"smishing", section:"learn", kind:"lesson", title:"Smishing: scam text messages",
  lead:"Smishing is phishing by text message (SMS). Texts are short, phones hide the full web address, and we tend to trust them, which is why scammers love them.",
  body:() => `
  <h2>Texts you’ll probably see</h2>
  <div class="cards">
    <div class="card" tabindex="0" data-tip-title="What it says" data-tip="“Your package is on hold due to an incomplete address. Update here.”"><h3><span class="icon-dot">${icon("mail")}</span>Delivery problem</h3><p>A package you may not have ordered needs a “small fee” or “address update”.</p><span class="hint">${icon("cursor")}Point here for an example</span></div>
    <div class="card" tabindex="0" data-tip-title="What it says" data-tip="“You have an unpaid toll of $4.15. Pay today to avoid a $50 fee.”"><h3><span class="icon-dot">${icon("money")}</span>Unpaid toll or fine</h3><p>A tiny amount you supposedly owe, with a threat if you don’t pay today.</p><span class="hint">${icon("cursor")}Point here for an example</span></div>
    <div class="card" tabindex="0" data-tip-title="What it says" data-tip="“Bank Alert: Did you try to spend $1,200? Reply YES or NO.” Replying starts a phone call from a fake fraud team."><h3><span class="icon-dot">${icon("bank")}</span>Bank alert</h3><p>A fake fraud alert that leads to a call from a fake “fraud department”.</p><span class="hint">${icon("cursor")}Point here for an example</span></div>
    <div class="card" tabindex="0" data-tip-title="What it says" data-tip="“Hi, is this Linda? We met at the reunion.” A friendly chat that slowly turns into a request for money or an investment."><h3><span class="icon-dot">${icon("chat")}</span>“Wrong number”</h3><p>A friendly stranger who texted “by mistake” and keeps chatting.</p><span class="hint">${icon("cursor")}Point here for an example</span></div>
  </div>
  <div class="note">${icon("info")}<p><b>Don’t reply to unknown numbers</b>, not even “STOP”. Any reply tells the scammer your number works. In the US, you can forward scam texts to <b>7726</b> (it spells SPAM) and then delete them.</p></div>`,
  quizzes:[{ id:"q-smish", concept:"bait",
    q:"A text says: “TollPass: You owe $4.15 in unpaid tolls. Pay today to avoid a $50 late fee: tollpass-pay.info”. You didn’t drive on a toll road. What should you do?",
    options:[
      {t:"Pay it. It’s only $4.15", ok:false, why:"The small amount is the trick. They want your card number so they can make much bigger charges later."},
      {t:"Delete it. If you’re unsure, check your toll account yourself on the official website or phone number", ok:true, why:"Correct. A surprise bill with a strange link and a deadline is a scam. Check on your own if you’re worried."},
      {t:"Reply STOP so they won’t text again", ok:false, why:"Replying tells scammers your number is active, and you’ll get even more scam texts."}
    ]}]
},
{ id:"messaging", section:"learn", kind:"lesson", title:"Scams on WhatsApp and chat apps",
  lead:"WhatsApp, Facebook Messenger, Telegram and similar apps feel personal, so scammers use them to pretend to be friends and family.",
  body:() => `
  <div class="cards">
    <div class="card"><h3><span class="icon-dot">${icon("family")}</span>“Hi Mum, new number”</h3><p>Someone pretends to be your child or grandchild on a new phone, then asks you to pay an urgent bill.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("key")}</span>“I sent you my code by mistake”</h3><p>A friend’s hacked account asks for a 6-digit code sent to your phone. That code lets them take over <b>your</b> account.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("money")}</span>Friendly stranger, then investing</h3><p>After weeks of kind messages, a new “friend” shows you how much they’ve made with crypto. It’s called ${term("pig butchering","Scammers spend weeks or months building trust (“fattening the pig”) before persuading the victim to invest in a fake crypto platform. Victims often lose their life savings.","Pig butchering")}.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("laptop")}</span>Easy job offers</h3><p>“Earn $300 a day liking videos.” Later, you’re asked to pay to unlock your earnings.</p></div>
  </div>
  <div class="note warn">${icon("alert")}<p>If a family member messages from a new number, <b>call their old number</b> or ask a question only they would know before doing anything.</p></div>`,
  quizzes:[{ id:"q-msg", concept:"info",
    q:"A friend messages you: “Hi! I accidentally sent a 6-digit code to your phone. Can you send it back to me?” What should you do?",
    options:[
      {t:"Send it. It’s my friend", ok:false, why:"Your friend’s account has probably been taken over. The code is for your account, and sending it gives the scammer control of it."},
      {t:"Don’t send it. Contact your friend another way, like a phone call", ok:true, why:"Right. Never share a code that was sent to you. Calling your friend lets you warn them that their account was hacked."},
      {t:"Send only the first three numbers", ok:false, why:"Don’t share any part of it. A code is like a key, and only you should use it."}
    ]}]
},
{ id:"phone-intro", section:"learn", kind:"lesson", title:"Phone scams: why they work",
  lead:"Phone scams are called vishing (voice phishing). A live, confident voice can be more convincing than any email.",
  body:() => `
  <div class="cards">
    <div class="card"><h3><span class="icon-dot">${icon("phone")}</span>Caller ID can lie</h3><p>Scammers can make any name or number show up, even your bank’s real number or “Police”. This is called ${term("spoofing","Faking the name or number that appears on your caller ID. It’s cheap and easy, so caller ID never proves who is calling.","Spoofing")}.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("speaker")}</span>Voices can be copied</h3><p>With a few seconds of someone’s voice from a video online, ${term("AI voice cloning","Computer programs can now copy a person’s voice from a short recording. Scammers use it to sound like a grandchild, a child or a boss.","AI voice cloning")} can make a scammer sound like your grandchild.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("book")}</span>They follow a script</h3><p>Scammers practice what to say, and have an answer for every question. Being polite and friendly is part of the act.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("eye")}</span>They may know things about you</h3><p>Your address or the last digits of your card may have leaked online. Knowing a detail doesn’t prove they’re real.</p></div>
  </div>
  <div class="note">${icon("shield")}<p>You are always allowed to hang up. A real bank or agency will never be upset if you hang up and call them back on a number you trust.</p></div>`,
  quizzes:[{ id:"q-phone", concept:"impersonation",
    q:"Your phone shows “Northgate Bank” and the bank’s real phone number. Does that prove the call is from your bank?",
    options:[
      {t:"Yes, the number matches", ok:false, why:"Caller ID can be faked to show any name and number, including your bank’s real one."},
      {t:"No. Hang up and call the number on the back of your card", ok:true, why:"Correct. Calling back on a number you already trust is the only way to be sure who you’re talking to."},
      {t:"Yes, if they also know your name", ok:false, why:"Names and addresses are easy for scammers to find. It doesn’t prove anything."}
    ]}]
},
{ id:"phone-scripts", section:"learn", kind:"lesson", title:"The most common phone scams",
  lead:"Point at (or tap) each card to hear what the scammer typically says, and the truth behind it.",
  body:() => `
  <div class="cards">
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="The IRS, Social Security and Medicare contact you by mail first. They never threaten immediate arrest and never ask for gift cards, crypto or wire transfers."><h3><span class="icon-dot">${icon("bank")}</span>Government imposter</h3><p>“This is Social Security. Your number has been suspended and there’s a warrant for your arrest.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="Hang up and call your grandchild or their parents on the number you already have. Agree on a family code word that a real relative would know."><h3><span class="icon-dot">${icon("family")}</span>Grandparent emergency</h3><p>“Grandma, it’s me. I’m in jail. Please don’t tell Mom.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="Microsoft, Apple and other tech companies don’t call you about viruses. Never let a caller control your computer."><h3><span class="icon-dot">${icon("laptop")}</span>Tech support</h3><p>“This is Microsoft. Your computer is sending us virus alerts. Let me connect to fix it.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="Your bank will never ask you to move money to a “safe account”, read out a code, or hand cash or cards to a courier."><h3><span class="icon-dot">${icon("shield")}</span>Bank “fraud department”</h3><p>“We see suspicious charges. Move your money to a safe account and read me the code we texted.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="You never have to pay to receive a real prize. If you didn’t enter, you didn’t win."><h3><span class="icon-dot">${icon("trophy")}</span>Prize or lottery</h3><p>“Congratulations, you’ve won $2.5 million! Just pay the taxes and fees first.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
    <div class="card" tabindex="0" data-tip-title="The truth" data-tip="Utility companies send written notices before cutting service. Call the number on your bill to check."><h3><span class="icon-dot">${icon("bolt")}</span>Utility shut-off</h3><p>“Your power will be cut off in one hour unless you pay right now.”</p><span class="hint">${icon("cursor")}Point here for the truth</span></div>
  </div>`,
  quizzes:[{ id:"q-scripts", concept:"action",
    q:"A caller who sounds just like your grandson says he’s in jail and begs you not to tell his parents. What’s the best thing to do?",
    options:[
      {t:"Send the money quickly, then tell his parents later", ok:false, why:"Money sent by gift card, wire or cash courier is almost impossible to get back. Check first."},
      {t:"Hang up and call your grandson, or his parents, on the number you already have", ok:true, why:"Yes. The voice can be faked, but calling the real person can’t. In almost every case, the grandchild is safe at home."},
      {t:"Ask the caller to prove who he is", ok:false, why:"Scammers are good at answering questions and may know family details from social media. Calling the real person is much safer."}
    ]}]
},
{ id:"phone-flags", section:"learn", kind:"lesson", title:"Red flags on a phone call",
  lead:"If you hear any of these on a call, hang up. Point at each one to learn more.",
  body:() => `
  <ul class="checklist">
    <li tabindex="0" data-tip="“You must act today.” “This offer ends in an hour.” Real organizations give you time to think.">${icon("clock")}<div><strong>Pressure to act right now</strong><span>Deadlines and rushing</span></div></li>
    <li tabindex="0" data-tip="Arrest, lawsuits, losing your benefits, deportation or a closed account. Threats are meant to scare you into obeying.">${icon("alert")}<div><strong>Threats</strong><span>Arrest, fines, account closed</span></div></li>
    <li tabindex="0" data-tip="“Don’t tell your family.” “Don’t tell the bank teller why you’re taking out money.” Secrecy keeps anyone from warning you.">${icon("hush")}<div><strong>Asking you to keep it secret</strong><span>Even from family or the bank</span></div></li>
    <li tabindex="0" data-tip="Gift cards, wire transfers, cryptocurrency, Bitcoin ATMs, payment apps, or cash handed to a courier. Real agencies and companies don’t take these.">${icon("gift")}<div><strong>Strange ways to pay</strong><span>Gift cards, wire, crypto, cash courier</span></div></li>
    <li tabindex="0" data-tip="Passwords, PINs, one-time codes, Social Security or Medicare numbers. A real company that calls you won’t ask for these.">${icon("key")}<div><strong>Asking for codes or passwords</strong><span>Or your Social Security number</span></div></li>
    <li tabindex="0" data-tip="“Install this app so I can help you.” This gives them control of your computer or phone and your bank accounts.">${icon("laptop")}<div><strong>Asking to install an app</strong><span>Or to “connect to your computer”</span></div></li>
    <li tabindex="0" data-tip="“Don’t hang up or you’ll lose your money.” They don’t want you to call the real company and find out the truth.">${icon("phone")}<div><strong>Keeping you on the line</strong><span>“Don’t hang up”</span></div></li>
    <li tabindex="0" data-tip="Prizes you didn’t enter, guaranteed investment returns, surprise refunds. If it sounds too good to be true, it is.">${icon("trophy")}<div><strong>Too good to be true</strong><span>Prizes, refunds, sure-thing investments</span></div></li>
  </ul>`,
  quizzes:[{ id:"q-flags", concept:"payment",
    q:"Which of these is a sure sign that a call is a scam?",
    options:[
      {t:"Your doctor’s office calls to confirm your appointment", ok:false, why:"That’s a normal call, as long as they don’t ask for payment details or personal numbers."},
      {t:"A “government agent” tells you to pay a fine with gift cards", ok:true, why:"Correct. No government agency, utility or real business will ever ask you to pay with gift cards."},
      {t:"Your bank asks you to come into a branch with your ID", ok:false, why:"Visiting a branch in person is a safe way to deal with your bank."}
    ]}]
},
{ id:"anatomy-email", section:"learn", kind:"anatomy", title:"Anatomy of a scam email",
  lead:"Here is a typical scam email. Each numbered highlight is a red flag. Point at a highlight (or tap it) to see why it’s a warning sign.",
  flags:{
    sender:{concept:"sender", title:"Look-alike sender address", why:"The name says “ShopRight” but the real address is “shopright-orders-help.com”. A real store emails from its own website name."},
    greet:{concept:"clues", title:"Generic greeting", why:"“Dear Customer” instead of your name. A store you shop with knows your name."},
    alarm:{concept:"bait", title:"A surprise charge you didn’t make", why:"A big charge you don’t recognize makes you panic, which is the point."},
    phone:{concept:"impersonation", title:"A phone number that goes to the scammer", why:"This number connects to the scammer, who will ask for your card details or to “connect to your computer” for a refund. Use the number on the real website or your card."},
    urgent:{concept:"urgency", title:"Deadline", why:"“Within 24 hours” is pressure so you won’t stop to check your real account."}
  },
  msg:{ kind:"email",
    from:"ShopRight Orders <[[sender:service@shopright-orders-help.com]]>",
    subject:"Your order #SR-88213 has been confirmed",
    body:[
      "[[greet:Dear Customer,]]",
      "Thank you for shopping with us. [[alarm:Your card has been charged $499.99 for: Laptop Pro 15” (Qty 1).]]",
      "If you did not make this purchase, [[phone:call our billing department at 1-888-555-0107]] to cancel and receive a full refund.",
      "[[urgent:Cancellations must be made within 24 hours, after which the charge is final.]]",
      "Thank you,<br>ShopRight Customer Care"
    ]},
  quizzes:[{ id:"q-anat-email", concept:"sender",
    q:"In the email above, the sender’s name shows “ShopRight Orders”, but the address is service@shopright-orders-help.com. What tells you who really sent it?",
    options:[
      {t:"The name “ShopRight Orders”", ok:false, why:"Anyone can type any name in the “From” line. The display name proves nothing."},
      {t:"The part after the @ sign", ok:true, why:"Correct. “shopright-orders-help.com” is not the store’s own website (that would be something like shopright.com). Always look at the full address, especially the part after the @."},
      {t:"The order number in the subject line", ok:false, why:"Anyone can make up an order number. It looks official but proves nothing."}
    ]}]
},
{ id:"anatomy-text", section:"learn", kind:"anatomy", title:"Anatomy of a scam text",
  lead:"Scam texts pack several red flags into a few lines. Point at each highlight to see what to look for.",
  flags:{
    num:{concept:"sender", title:"Random personal number", why:"Real toll agencies and big companies usually text from short official numbers (5 or 6 digits), and only if you signed up."},
    amt:{concept:"bait", title:"Small, surprising amount", why:"$4.15 seems too small to worry about, so you pay without thinking. The real goal is your card number."},
    threat:{concept:"urgency", title:"Threat and deadline", why:"Losing your driver’s license over $4 is not how real agencies work. The threat is meant to scare you."},
    lnk:{concept:"links", title:"Strange link", why:"“tollpass-pay.info” is not an official website. Government toll sites usually end in “.gov” or “.org” and you can find them yourself."},
    reply:{concept:"links", title:"“Reply Y to activate the link”", why:"Your phone turns off links from unknown senders to protect you. Replying turns them on and tells the scammer your number is real."}
  },
  msg:{ kind:"sms",
    sender:"[[num:+1 (812) 555-0193]]",
    bubbles:[
      "TollPass Notice: [[amt:You have an unpaid toll balance of $4.15.]] [[threat:Pay by today to avoid a $50 late fee and suspension of your driver’s license.]]",
      "[[lnk>https://tollpass-pay.info/us|https://tollpass-pay.info/us]]",
      "[[reply:Reply Y, then reopen this message to activate the link.]]"
    ]},
  quizzes:[{ id:"q-anat-text", concept:"links",
    q:"Phones often show only part of a web address. What is the safest way to check a delivery or bill that came by text?",
    options:[
      {t:"Tap the link and look at the website carefully", ok:false, why:"Fake websites can look exactly like real ones, and just visiting some sites can be risky."},
      {t:"Open the company’s official app, or type its website yourself, and look up your account there", ok:true, why:"Right. When you go there yourself, the scammer’s link never gets a chance."},
      {t:"Reply to the text asking for more details", ok:false, why:"Replying confirms your number to scammers and invites more messages."}
    ]}]
},
{ id:"links", section:"learn", kind:"lesson", title:"How to read a web address",
  lead:"Scammers build web addresses that contain a real company’s name but belong to someone else. Here’s how to find the real owner.",
  body:() => `
  <h2>The real owner is just before the first single slash</h2>
  <div class="url-box"><span class="url"><span class="u-dim">https://</span><span class="u-dim">login.</span><span class="u-own">northgatebank.com</span><span class="u-dim">/account</span></span>
    <div class="url-legend"><span><i style="background:var(--good-soft);box-shadow:inset 0 -3px 0 var(--good)"></i>Owner: Northgate Bank</span><span>Anything before it (like “login.”) is just a label the owner chose.</span></div></div>
  <div class="url-box"><span class="url"><span class="u-dim">https://</span><span class="u-fake">northgatebank.com.</span><span class="u-bad">secure-check.net</span><span class="u-dim">/login</span></span>
    <div class="url-legend"><span><i style="background:var(--bad-soft);box-shadow:inset 0 -3px 0 var(--bad)"></i>Owner: secure-check.net (not the bank!)</span><span><i style="background:var(--flag-soft)"></i>The bank’s name is just a decoy label</span></div></div>
  <h2>Who really owns these? Point at each one</h2>
  <div class="urlrows">
    <div class="urlrow" tabindex="0" data-tip-title="Safe" data-tip="Owner: northgatebank.com. This is the real bank’s website."><span class="mono">www.northgatebank.com/login</span></div>
    <div class="urlrow" tabindex="0" data-tip-title="Fake" data-tip="Owner: northgate-bank-alerts.com. Extra words joined with dashes make a completely different website."><span class="mono">northgate-bank-alerts.com</span></div>
    <div class="urlrow" tabindex="0" data-tip-title="Fake" data-tip="Owner: n0rthgatebank.com. The letter “o” was swapped for the number zero."><span class="mono">n0rthgatebank.com</span></div>
    <div class="urlrow" tabindex="0" data-tip-title="Fake" data-tip="Owner: northgatebank.co. Missing the “m”. Look-alike endings like .co, .net or .top are common tricks."><span class="mono">northgatebank.co/verify</span></div>
  </div>
  <h2>Try it: hover before you click</h2>
  <div class="demo">
    <div class="demo-body"><p>On a computer, rest your mouse on a link <b>without clicking</b>. The real address appears at the bottom of the window. Try it on this button (or tap it):</p>
    <span class="fakebtn" tabindex="0" data-url="http://northgate-verify.co/secure/login.php">Sign in to Northgate Bank</span></div>
    <div class="statusbar">Point at the button to see where it really goes</div>
  </div>`,
  quizzes:[{ id:"q-links", concept:"links",
    q:"Northgate Bank’s real website is northgatebank.com. Which of these addresses really belongs to the bank?",
    options:[
      {t:"northgatebank.com.secure-login.net", ok:false, why:"The owner is “secure-login.net”. The bank’s name at the front is a decoy."},
      {t:"northgate-bank-support.com", ok:false, why:"Extra words with dashes make a different website that anyone could buy."},
      {t:"www.northgatebank.com/help", ok:true, why:"Correct. Right before the first single slash is “northgatebank.com”, the real bank."}
    ]}]
},
{ id:"rules", section:"learn", kind:"lesson", title:"Four habits that beat almost every scam",
  lead:"You don’t need to memorize every scam. These four habits protect you from nearly all of them.",
  body:() => `
  <div class="rules">
    <div class="rule"><span class="word">Stop</span><p>Don’t click, reply, pay or give information. Hang up. A real problem can wait ten minutes.</p></div>
    <div class="rule"><span class="word">Check</span><p>Contact the company yourself using a number from your card, a bill or the official website, never the one in the message.</p></div>
    <div class="rule"><span class="word">Talk</span><p>Tell a family member or friend. Scammers want secrecy; a second opinion breaks the spell.</p></div>
    <div class="rule"><span class="word">Report</span><p>Reporting helps stop scammers and can help you recover money if you lost any.</p></div>
  </div>
  <h2>Where to report (in the US)</h2>
  <div class="report">
    <div class="report-row"><b>Any scam or fraud</b><span>Federal Trade Commission: <span class="mono">ReportFraud.ftc.gov</span></span></div>
    <div class="report-row"><b>Scam text messages</b><span>Forward the text to <span class="mono">7726</span></span></div>
    <div class="report-row"><b>Phishing emails</b><span>Forward to <span class="mono">reportphishing@apwg.org</span></span></div>
    <div class="report-row"><b>Free help line for anyone</b><span>AARP Fraud Watch Network: <span class="mono">877-908-3360</span></span></div>
    <div class="report-row"><b>If you sent money</b><span>Call your bank or card company right away, using the number on your card.</span></div>
  </div>
  <p class="empty">Outside the US, contact your national fraud reporting center and your bank.</p>
  <div class="note">${icon("family")}<p><b>Family code word:</b> agree on a secret word with your family. If someone calls claiming to be a relative in trouble, ask for the word.</p></div>`,
  quizzes:[{ id:"q-rules", concept:"action",
    q:"You get a frightening call saying your bank account has been hacked. What’s the safest move?",
    options:[
      {t:"Do what the caller says to protect your money", ok:false, why:"If the caller is a scammer, following instructions is exactly how money is stolen."},
      {t:"Hang up and call the number on the back of your bank card", ok:true, why:"Yes. Stop, then check with your bank directly. If there’s a real problem, the bank will help you."},
      {t:"Give them only the last four digits of your card", ok:false, why:"Don’t give any details on a call you didn’t make. Hang up and call your bank yourself."}
    ]}]
},

  body:() => `
  <div class="cards">
    <div class="card"><h3><span class="icon-dot">${icon("cursor")}</span>Click what looks wrong</h3><p>Click or tap any part of the message you think is a red flag: a word, a sentence, the sender, a link.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("check")}</span>See if you’re right</h3><p>A correct find turns <b>green</b> with a number and an explanation. If that part is fine, we’ll tell you why.</p></div>
    <div class="card"><h3><span class="icon-dot">${icon("eye")}</span>Stuck? Ask for help</h3><p>Press <b>Show me the red flags</b> to see everything you missed. Red flags found after that don’t count toward your score.</p></div>

{ id:"p-bank", section:"practice", kind:"spot", title:"A bank security email",
  scenario:"You bank with Northgate Bank. This email arrives early one morning.",
  flags:{
    sender:{concept:"sender", title:"Fake sender address", why:"The name says “Northgate Bank” but the address ends in “northgate-secure-alerts.com”. Real bank emails come from the bank’s own website name (northgatebank.com)."},
    greet:{concept:"clues", title:"Generic greeting", why:"“Dear Valued Customer”: your bank knows your name and normally uses it."},
    typo:{concept:"clues", title:"Spelling and grammar mistakes", why:"“recieve” and “you’re account” are mistakes a real bank’s email team would catch."},
    urgent:{concept:"urgency", title:"Threat with a deadline", why:"“Within 24 hours … permanently closed” is pressure to make you act before you think."},
    link:{concept:"links", title:"Button goes to a fake website", why:"The button says “Verify My Account” but the address underneath is northgate-verify.co. Always point at a link before clicking."},
    info:{concept:"info", title:"Asks for private information", why:"No bank will ever ask you to confirm your full card number, PIN and Social Security number online."}
  },
  msg:{ kind:"email",
    from:"Northgate Bank Security <[[sender:security@northgate-secure-alerts.com]]>",
    subject:"{{Unusual sign-in activity detected|A security-sounding subject line alone isn’t proof either way. Look at the sender and what the email asks you to do.}}",
    body:[
      "[[greet:Dear Valued Customer,]]",
      "{{We detected an unusual sign-in attempt on your online banking from a device in another country.|Banks really do send sign-in alerts, so this sentence alone isn’t a red flag. What matters is what they ask you to do next.}} For your protection, we have temporarily limited your account.",
      "To restore full access, you must verify your identity. [[typo:If we do not recieve your confirmation]] [[urgent:within 24 hours, your account will be permanently closed.]]",
      {button:"[[link>Verify My Account|http://northgate-verify.co/login]]"},
      "You will be asked to confirm [[info:your full card number, PIN and Social Security number]] to complete the process.",
      "Thank you for keeping [[typo:you’re account]] safe.<br>{{Northgate Bank Security Team|A sign-off with the company name is easy to fake, so it doesn’t tell you much either way.}}"
    ],
    foot:"{{© 2026 Northgate Bank. Member FDIC. All rights reserved.|Copying a legal footer costs scammers nothing. It doesn’t prove the email is real, but it isn’t a red flag either.}}"
  }
},
{ id:"p-delivery", section:"practice", kind:"spot", title:"A delivery text",
  scenario:"You’re at home and this text pops up on your phone.",
  flags:{
    num:{concept:"sender", title:"Strange sender number", why:"This is an overseas number (+63 is the Philippines). Delivery companies text from short official numbers, and only when you’ve signed up."},
    addr:{concept:"bait", title:"A surprise problem", why:"Were you even expecting a package? Scammers send this to millions of people, knowing many are waiting for a delivery."},
    urg:{concept:"urgency", title:"Short deadline", why:"“Within 12 hours or it will be returned” is meant to rush you."},
    lnk:{concept:"links", title:"Fake website address", why:"“quickship-redeliver.top” isn’t the company’s website. The “.top” ending and added words are big warning signs."},
    fee:{concept:"payment", title:"Small fee to get your card number", why:"A $1.25 fee seems harmless, but the goal is your full card details, which they’ll use for much bigger charges."},
    reply:{concept:"links", title:"Asks you to reply to turn on the link", why:"Your phone disables links from unknown senders. Replying turns them on and tells scammers your number is active."}
  },
  msg:{ kind:"sms",
    sender:"[[num:+63 917 555 0148]]",
    bubbles:[
      "QuickShip: Your package {{#QS48201|A tracking number looks official, but anyone can make one up. It isn’t one of the main red flags here.}} is on hold [[addr:due to an incomplete address.]] [[urg:Update within 12 hours or it will be returned to sender.]]",
      "[[lnk>https://quickship-redeliver.top/us|https://quickship-redeliver.top/us]] [[fee:A $1.25 redelivery fee applies.]]",
      "[[reply:Reply Y and reopen this message to activate the link.]]"
    ]}
},
{ id:"p-boss", section:"practice", kind:"spot", title:"An email from the boss",
  scenario:"You work in the office at Brightwell Supplies. Margaret Chen is the company’s CEO. This email arrives at 9:05 on a Monday.",
  flags:{
    sender:{concept:"sender", title:"Personal email for company business", why:"The CEO would use the company address (@brightwellsupplies.com), not a free Gmail account anyone could create."},
    busy:{concept:"secrecy", title:"Blocks you from checking", why:"“Can’t take calls today” stops you from confirming the request by phone or in person."},
    gift:{concept:"payment", title:"Gift card purchase", why:"Real companies don’t pay clients or suppliers with gift cards bought by staff. Gift cards are a scammer’s favorite, because they can’t be traced."},
    codes:{concept:"payment", title:"Send photos of the codes", why:"Once someone has the codes, the money is spent within minutes and can’t be refunded."},
    rush:{concept:"urgency", title:"Within the hour", why:"A tight deadline leaves no time to ask anyone else."},
    secret:{concept:"secrecy", title:"Keep it between us", why:"Asking you to keep it secret stops coworkers from warning you."}
  },
  msg:{ kind:"email",
    from:"Margaret Chen <[[sender:margaret.chen.ceo@gmail.com]]>",
    subject:"{{Quick favor|A short, casual subject line is common in both real and fake emails.}}",
    body:[
      "{{Hi Daniel,|Using your name makes it feel real. Scammers find staff names on company websites and LinkedIn. That’s what makes it spear phishing, but the greeting alone isn’t the clue here.}}",
      "[[busy:Are you at your desk? I’m in back-to-back meetings and can’t take calls today.]]",
      "I need you to [[gift:purchase 6 gift cards at $250 each]] for a client appreciation surprise. [[codes:Scratch off the backs and email me photos of the codes]] [[rush:within the next hour.]]",
      "[[secret:Please keep this between us for now. I want it to be a surprise.]] {{I’ll pay you back by the end of the day.|A promise to repay you sounds reassuring, but it isn’t the key warning sign here. Look at how they want to be paid and who sent it.}}",
      "Thanks,<br>Margaret<br>{{Sent from my iPhone|Many real emails end this way. It isn’t a red flag on its own.}}"
    ]}
},
{ id:"p-chat", section:"practice", kind:"spot", title:"A message on a chat app",
  scenario:"You have two grown children. This message appears in your chat app from a number you don’t know.",
  flags:{
    unknown:{concept:"sender", title:"Unknown number", why:"The app itself warns you this number isn’t in your contacts. Treat it as a stranger until you’ve checked."},
    noname:{concept:"impersonation", title:"Never says who they are", why:"They say “Mum” but never give a name, so you fill in the blank with whichever child you think it is."},
    newnum:{concept:"impersonation", title:"The “new number” story", why:"“I lost my phone, this is my new number” is the classic opening of this scam."},
    delete:{concept:"secrecy", title:"Delete the old number", why:"This stops you from calling the real number to check. Scammers want to cut off the way you’d find out."},
    pay:{concept:"payment", title:"Urgent request for money", why:"Asking for money right after a “new number” message is the heart of this scam."},
    acct:{concept:"payment", title:"The account isn’t your child’s", why:"The money goes to “J. Rivera Holdings”, a stranger’s account. Your real child would use their own account."},
    call:{concept:"secrecy", title:"Won’t talk on the phone", why:"They avoid calls because you would hear that it isn’t your child."}
  },
  msg:{ kind:"chat",
    sender:"+1 (305) 555-0172",
    banner:"[[unknown:This number is not in your contacts.]]",
    bubbles:[
      "[[noname:Hi Mum, it’s me 😊]]",
      "[[newnum:I dropped my phone in the sink, this is my new number.]] [[delete:Save this one and delete the old number.]]",
      {out:true, t:"Oh no! Are you okay?"},
      "{{Yes fine, just stressed.|Sounding stressed is natural and isn’t a clue by itself.}} I have a bill due today and my banking app is locked on the new phone. [[pay:Could you pay it for me? It’s $780, I’ll pay you back tomorrow ❤️]]",
      "[[acct:Name: J. Rivera Holdings · Account ending 5530]]",
      "[[call:Can’t talk right now, the mic on this phone isn’t working. Text only pls]]"
    ]}
},
{ id:"p-safe", section:"practice", kind:"quizset", title:"Scam or safe?",
  lead:"Not every message is a scam. Decide whether each one is safe or a scam.",
  quizzes:[
    { id:"q-ss-pharmacy", concept:"action", label:"Message 1",
      mock:{kind:"sms", sender:"72384", bubbles:["Main Street Pharmacy: Your prescription is ready for pickup at our Elm Ave location. Questions? Call the number on your prescription label. Reply STOP to opt out."]},
      context:"You use Main Street Pharmacy and are waiting for a refill.",
      q:"Is this message safe or a scam?",
      options:[
        {t:"Safe", ok:true, why:"It doesn’t ask for information, money or a click, and it tells you to use a number you already have. That’s what a normal notice looks like."},
        {t:"Scam", ok:false, why:"This one is fine. There’s no link, no deadline, no request for money or details, and you’re a real customer who expects it."}
      ]},
    { id:"q-ss-stream", concept:"links", label:"Message 2",
      mock:{kind:"email", from:"StreamBox Billing <billing@streambox-accounts.net>", subject:"Payment declined: account on hold", body:["We couldn’t process your last payment. Update your billing details within 48 hours to keep watching:", "<span class=\"lnk\">streambox-account-update.net/billing</span>"]},
      q:"Is this message safe or a scam?",
      options:[
        {t:"Safe", ok:false, why:"Look closer: the sender and the link use look-alike websites, and there’s a deadline. Check by opening the StreamBox app yourself."},
        {t:"Scam", ok:true, why:"Right. A look-alike sender, a strange link and a deadline. If you’re worried, open the app or type the real website yourself."}
      ]},
    { id:"q-ss-code", concept:"action", label:"Message 3",
      mock:{kind:"sms", sender:"55021", bubbles:["Northgate Bank: Your sign-in code is 482910. It expires in 10 minutes. We will never call or text to ask for this code."]},
      context:"You just tried to sign in to your Northgate Bank app.",
      q:"Is this message safe or a scam?",
      options:[
        {t:"Safe", ok:true, why:"You asked for this code, there’s no link, and it warns you never to share it. Use it to sign in, and never read it to anyone."},
        {t:"Scam", ok:false, why:"This one is real: you just requested it, and it has no link or request. The danger comes if someone asks you to share it."}
      ]},
    { id:"q-ss-codecall", concept:"info", label:"Message 4",
      mock:{kind:"call", callerId:"Northgate Bank", lines:[{who:"Caller", t:"Hi, this is the Northgate Bank security team. To confirm your identity, please read me the 6-digit code we just sent you."}]},
      context:"Five minutes later, your phone rings.",
      q:"Is this call safe or a scam?",
      options:[
        {t:"Safe", ok:false, why:"The text itself said the bank will never ask for the code. Anyone asking for it is trying to get into your account."},
        {t:"Scam", ok:true, why:"Correct. A real bank will never ask you to read out a code. Hang up and call the number on your card."}
      ]}
  ]
},
{ id:"p-grandparent", section:"practice", kind:"spot", title:"A call from a “grandson”",
  scenario:"Your phone rings late in the evening. Here is what was said. Click on each line that contains a red flag.",
  flags:{
    guess:{concept:"impersonation", title:"Makes you say the name", why:"He doesn’t say his name, hoping you’ll say “Michael, is that you?” Then he becomes Michael. AI can even make the voice sound right."},
    excuse:{concept:"impersonation", title:"Excuse for the wrong voice", why:"A cold or a broken nose explains why he doesn’t sound like himself."},
    crisis:{concept:"urgency", title:"Shocking emergency", why:"An accident and jail create fear, and love makes you want to help immediately."},
    secret:{concept:"secrecy", title:"Don’t tell Mom and Dad", why:"Secrecy stops you from calling his parents, who would tell you he’s safe at home."},
    lawyer:{concept:"impersonation", title:"A second “official” joins", why:"Handing the phone to a “lawyer” or “officer” adds authority and makes the story feel real."},
    cash:{concept:"payment", title:"Cash picked up by a courier", why:"Courts don’t send couriers to collect bail. Once cash is handed over, it’s gone."},
    today:{concept:"urgency", title:"Within two hours", why:"The tight deadline is meant to stop you from checking with anyone."},
    gag:{concept:"secrecy", title:"A fake “gag order”", why:"There’s no rule that stops you talking to your own family or bank. It’s meant to stop the bank teller from warning you."}
  },
  msg:{ kind:"call",
    callerId:"{{Unknown number|An unknown number isn’t proof of a scam, but it’s a reason to stay alert.}}",
    lines:[
      {who:"You", t:"{{Hello?|This is you answering. Nothing wrong here.}}"},
      {who:"Caller", t:"[[guess:Grandma? It’s me… your favorite grandson.]]"},
      {who:"You", t:"{{Michael? You sound different.|This is your reply. Notice how the caller got you to say his name.}}"},
      {who:"Caller", t:"[[excuse:I have a cold, and my nose got hurt in the accident.]] [[crisis:I was in a car crash and the police arrested me. I’m in jail right now.]]"},
      {who:"Caller", t:"[[secret:Please, please don’t tell Mom and Dad. They’ll be so angry.]] [[lawyer:My lawyer is here, he’ll explain.]]"},
      {who:"“Lawyer”", t:"{{Ma’am, this is attorney Robert Klein. Your grandson needs $9,000 for bail.|The polite, professional tone is part of the act, but the big clues are in what he asks you to do.}} [[cash:You’ll need to withdraw cash. A courier will come to your house to collect it]] [[today:within two hours.]]"},
      {who:"“Lawyer”", t:"[[gag:There’s a gag order on this case, so you can’t discuss it with anyone, including the bank.]]"}
    ]}
},
{ id:"p-bankcall", section:"practice", kind:"spot", title:"A call from the “fraud department”",
  scenario:"Your phone shows that your bank is calling. Here is the call. Click each part that’s a red flag, including anything on the screen.",
  flags:{
    spoof:{concept:"impersonation", title:"Caller ID can be faked", why:"Scammers can make any name and number appear, even your bank’s real number. Caller ID proves nothing."},
    charge:{concept:"urgency", title:"Scary surprise charge", why:"A big charge you didn’t make is meant to rattle you so you follow instructions."},
    code:{concept:"info", title:"Asks for your one-time code", why:"That code is the key to your account. The scammer is probably signing in as you at that very moment."},
    move:{concept:"payment", title:"Move money to a “safe account”", why:"There’s no such thing. A real bank protects your account itself; it never asks you to move your money."},
    line:{concept:"secrecy", title:"Don’t hang up", why:"They don’t want you to hang up and call your bank on the number on your card, which is exactly what you should do."},
    teller:{concept:"secrecy", title:"Tells you to lie to the bank", why:"Anyone who coaches you to give bank staff a false reason is a scammer, every time."}
  },
  msg:{ kind:"call",
    callerId:"[[spoof:Northgate Bank · 1-800-555-0199]]",
    lines:[
      {who:"Caller", t:"{{Hello, this is Kevin from the Northgate Bank fraud department.|Real banks do have fraud teams, and a name is easy to invent. Judge the call by what they ask you to do.}}"},
      {who:"Caller", t:"[[charge:We’ve stopped a suspicious charge of $1,249 at an electronics store in Miami. Did you make this purchase?]]"},
      {who:"You", t:"{{No! I didn’t.|This is your reply. Nothing wrong here.}}"},
      {who:"Caller", t:"{{Don’t worry, I’ll help you.|Sounding helpful and calm is part of the act, but it isn’t a red flag on its own.}} [[code:To verify it’s you, please read me the 6-digit code we just texted you.]]"},
      {who:"Caller", t:"[[move:Your account has been compromised. To protect your savings, we need to move them into a new secure account we’ve set up for you.]]"},
      {who:"Caller", t:"[[line:Don’t hang up. If the call drops, the hackers could empty your account.]]"},
      {who:"Caller", t:"[[teller:If the teller asks why you’re moving the money, just say it’s for a home renovation. Some bank employees are under investigation.]]"}
    ]}
},
{ id:"p-refund", section:"practice", kind:"spot", title:"A tax refund email",
  scenario:"You filed your taxes months ago. This email shows up in your inbox.",
  flags:{
    sender:{concept:"sender", title:"Government look-alike address", why:"Real US government emails end in “.gov”. “tax-refund-gov.org” is just a website anyone can buy."},
    bait:{concept:"bait", title:"Unexpected money", why:"A surprise refund is bait. Tax agencies don’t email you out of the blue about refunds."},
    greet:{concept:"clues", title:"Generic greeting", why:"“Dear Taxpayer” instead of your name."},
    att:{concept:"links", title:"Dangerous attachment", why:"An attachment ending in “.html”, “.zip” or “.exe” can open a fake login page or install harmful software. Don’t open attachments you didn’t expect."},
    bank:{concept:"info", title:"Asks for bank details", why:"They want your account and routing numbers. That’s enough to take money, not give it."},
    deadline:{concept:"urgency", title:"Deadline", why:"“Within 3 days” pushes you to act before checking."}
  },
  msg:{ kind:"email",
    from:"Tax Refund Services <[[sender:refunds@tax-refund-gov.org]]>",
    subject:"[[bait:You are eligible for a tax refund of $847.20]]",
    body:[
      "[[greet:Dear Taxpayer,]]",
      "{{After the annual calculation of your fiscal activity, we have determined that you are eligible to receive a tax refund.|Stiff, formal wording is common in scams, but it isn’t one of the main red flags here.}}",
      "Please download and complete the attached form. [[bank:You will need to enter your bank account and routing number so we can deposit your refund.]]",
      "[[deadline:Refunds not claimed within 3 days will be cancelled.]]",
      "{{Refund Department|A department name is easy to make up. It doesn’t prove anything either way.}}"
    ],
    attach:"[[att:Refund_Form_2026.html]]"
  }
},
{ id:"p-what", section:"practice", kind:"quizset", title:"What would you do?",
  lead:"Choose the best response to each situation.",
  quizzes:[
    { id:"q-wd-popup", concept:"action", label:"Situation 1",
      mock:{kind:"popup", title:"Security Alert", body:["<strong>WARNING! Your computer is infected with 5 viruses.</strong>", "Your files and banking information are at risk. Call Windows Support immediately at <b>1-888-555-0143</b>. Do not close this window."]},
      context:"This appears on your computer while you’re reading the news, with a loud beeping sound.",
      q:"What should you do?",
      options:[
        {t:"Call the number right away", ok:false, why:"The number goes to scammers who will ask to control your computer and then charge you, or steal from your bank."},
        {t:"Close the browser. If it won’t close, restart the computer", ok:true, why:"Right. These pop-ups are fake. Closing the browser or restarting makes them go away. Real virus warnings never include a phone number."},
        {t:"Click OK to start the virus scan", ok:false, why:"Clicking anything on the pop-up can download harmful software. Close the browser instead."}
      ]},
    { id:"q-wd-ssa", concept:"impersonation", label:"Situation 2",
      mock:{kind:"call", callerId:"Social Security Admin", lines:[{who:"Recording", t:"This is Officer Hayes with Social Security. Your Social Security number has been suspended due to suspicious activity. Press 1 to speak with an agent, or a warrant will be issued for your arrest."}]},
      q:"What’s true about this call?",
      options:[
        {t:"Press 1 to sort it out quickly", ok:false, why:"Pressing 1 connects you to a scammer and tells them your number works."},
        {t:"It’s a scam. Social Security numbers can’t be “suspended”, and the agency doesn’t threaten arrest. Hang up", ok:true, why:"Correct. Government agencies don’t make threatening robocalls. If you’re worried, call Social Security on its official number."},
        {t:"Read them your Social Security number so they can check it", ok:false, why:"Never give your Social Security number to someone who calls you."}
      ]},
    { id:"q-wd-prize", concept:"bait", label:"Situation 3",
      mock:{kind:"call", callerId:"Prize Center", lines:[{who:"Caller", t:"Congratulations! You’ve won $2.5 million and a new car in the National Sweepstakes! To release your prize, you just need to pay $499 in taxes and fees with gift cards today."}]},
      q:"What should you do?",
      options:[
        {t:"Pay the $499. It’s small compared to the prize", ok:false, why:"There is no prize. After the first payment they’ll ask for more, and more."},
        {t:"Hang up. You never have to pay to collect a real prize", ok:true, why:"Correct. Real prizes don’t require fees, and gift cards are a scam payment. If you didn’t enter, you didn’t win."},
        {t:"Ask them to take the fees out of the winnings", ok:false, why:"They’ll have an excuse ready. There are no winnings. Just hang up."}
      ]}
  ]
},
{ id:"p-final", section:"practice", kind:"quizset", title:"Final check",
  lead:"Three last questions before your results.",
  quizzes:[
    { id:"q-fin-crypto", concept:"bait", label:"Question 1",
      mock:{kind:"chat", sender:"Jenny", bubbles:["Good morning dear! ☀️ Did you sleep well?", "I made $4,200 this week on my crypto trading app. My uncle is an expert and shows me what to buy. I could show you too, it’s very safe 😊"]},
      context:"Jenny texted you by “wrong number” three weeks ago. You’ve chatted every day since, but never met or spoken on the phone.",
      q:"What is most likely happening?",
      options:[
        {t:"A new friend sharing good luck", ok:false, why:"Weeks of friendly chat followed by an investment offer is the pattern of a very costly scam."},
        {t:"An investment scam. Stop contact and never send money to someone you’ve only met online", ok:true, why:"Correct. This is “pig butchering”. The trading app is fake; the profits you see on screen can’t be taken out."},
        {t:"Fine, as long as you start with a small amount", ok:false, why:"Small investments often “grow” on screen to tempt you into sending much more. You won’t be able to withdraw any of it."}
      ]},
    { id:"q-fin-never", concept:"payment", label:"Question 2",
      q:"Which of these will a real bank, government agency or company NEVER ask you to do?",
      options:[
        {t:"Sign in through their official app or website", ok:false, why:"That’s normal, as long as you open the app or type the website yourself."},
        {t:"Pay with gift cards, or move your money to a “safe account”", ok:true, why:"Correct. These are always scams, no matter who seems to be asking."},
        {t:"Visit a branch or office with your ID", ok:false, why:"That’s a normal, safe request."}
      ]},
    { id:"q-fin-oops", concept:"action", label:"Question 3",
      q:"Oops! You clicked a link and typed your bank password on a fake website. What should you do first?",
      options:[
        {t:"Wait and see if anything happens", ok:false, why:"Scammers act fast. Every minute counts."},
        {t:"Call your bank on the number on your card, and change your password on the real website", ok:true, why:"Right. Your bank can watch for or block suspicious activity. Also change the password anywhere else you used it, and report it."},
        {t:"Reply to the email and ask them to delete your information", ok:false, why:"That only tells the scammer you’re paying attention. Contact your bank directly."}
      ]}
  ]
},
{ id:"checkpoint", section:"checkpoint", kind:"checkpoint", title:"How you did on scam messages and calls",
  lead:"Here’s your score for Parts 1 and 2: the lessons and practice on phishing emails, texts, chat apps and phone calls." },
/* ---------------------------------------------------------------- TRAVEL (in person, abroad) */
{ id:"travel-intro", section:"travel", kind:"lesson", title:"Traveling abroad: scams that happen face to face",
  lead:"Most people you’ll meet in India, Pakistan and elsewhere are honest and generous to visitors. But in busy tourist spots, a few scammers look for travelers who are tired, unsure of prices and too polite to say no.",
  body:() => `
  <p>The warning signs are the same ones you’ve already learned: <b>surprise problems, pressure, secrecy and strange ways to pay</b>. The difference is that the scammer is standing in front of you, smiling. Point at each reason below to see why travelers are targets.</p>
  <div class="chips">
